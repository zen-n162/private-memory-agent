[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-memory-agent"
version = "0.1.0"
description = "Local-first private memory assistant skeleton."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private" }
authors = [{ name = "Private Memory Agent maintainers" }]
dependencies = [
    "fastapi>=0.110",
    "Pillow>=10",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]
local-models = [
    "sentence-transformers>=3",
]

[project.scripts]
pma = "private_memory_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "real_embeddings: requires a local sentence-transformers-compatible model path",
    "qdrant: requires a running Qdrant service and qdrant-client",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
