# Safe example golden questions for answer-quality evaluation.
#
# Copy to configs/golden_questions.local.yaml for private local questions.
# The local file is ignored by Git through configs/*.local.yaml.
# Keep ids non-private if you plan to share reports.

questions:
  - id: research_notes
    category: research
    text: "研究に関係するメモやLINEの記録を探してください。"
    sources:
      - line
      - notes
    expected_sources:
      - line
      - notes
    required_sources:
      - notes
    preferred_sources:
      - notes
    excluded_sources: []
    expected_keywords:
      - 研究
    negative_keywords: []
    evaluation_focus:
      - evidence_relevance
      - source_coverage
  - id: outing_photos
    category: photos
    text: "外出や屋外に関係しそうな写真の記録を探してください。"
    sources:
      - photos
    expected_sources:
      - photos
    required_sources: []
    preferred_sources:
      - photos
    excluded_sources: []
    expected_keywords:
      - 外出
    negative_keywords: []
    evaluation_focus:
      - evidence_relevance
  - id: insufficient_evidence
    category: safety
    text: "根拠が足りない場合は不明と答えてください。"
    sources:
      - photos
      - line
      - notes
    expected_sources:
      - photos
      - line
      - notes
    required_sources: []
    preferred_sources: []
    excluded_sources: []
    expected_keywords: []
    negative_keywords: []
    evaluation_focus:
      - uncertainty_handling
